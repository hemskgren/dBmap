[project]
name = "dbmap-hub-bootstrap"
version = "0.1.0"
description = "dBmap hub-bootstrap: identity, provisioning, desired/reported state"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.54",
    "paho-mqtt==2.1.0",
    "pydantic-settings==2.6.1",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "anyio==4.15.1",
    "httpx==0.27.2",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
