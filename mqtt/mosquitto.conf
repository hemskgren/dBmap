persistence true
persistence_location /mosquitto/data/

log_dest stdout
# Host-mounted for fail2ban (see shared/mosquitto/logs).
log_dest file /mosquitto/log/mosquitto.log
log_timestamp true
log_timestamp_format %d/%b/%Y %H:%M:%S
log_type error
log_type warning
log_type notice
log_type information

plugin_load dynsec /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/data/runtime/ca.crt
certfile /mosquitto/data/runtime/mosquitto.crt
keyfile /mosquitto/data/runtime/mosquitto.key
require_certificate false
listener_allow_anonymous false
tls_version tlsv1.2
# Ear hello/health grows with audio.microphones[] (≈1 KiB per mic + envelope).
# 4096 fit mic_count≤2; mic_count=4 overflows and Mosquitto resets the TLS
# session (device sees Connection reset by peer on the first health publish).
max_packet_size 16384
max_connections 100
sys_interval 10
plugin_use dynsec
