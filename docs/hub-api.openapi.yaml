openapi: 3.0.3
info:
  title: dBmap Hub API
  version: v1
  description: "HTTPS API served by `hub-bootstrap` and published on the LAN through Nginx. Call `https://<hub-host>:<https-port>[<public-base-path>]/api/v1/...`. Local administrators and viewers send `Authorization: Bearer <token>`. The API checks the token, then asks OPA for the named action. `GET /health` and `POST /api/v1/provision` do not use admin/viewer bearer tokens or OPA. Device provisioning uses a one-time bootstrap token in the JSON body. `GET /api/v1/device/desired-firmware` and `GET /api/v1/device/ota-image` authenticate a separate device API token in the Hub database and do not call OPA. Authorization actions for human tokens are listed in docs/authorization.md."
  contact:
    name: dBmap Hub
