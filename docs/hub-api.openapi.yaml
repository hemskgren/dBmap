  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Local `DBMAP_ADMIN_TOKEN` or `DBMAP_VIEWER_TOKEN`. OPA then decides the action.
servers:
  - url: https://hub.local:8443
    description: Default local Hub URL through Nginx. Replace host and port from .env.
  - url: /
    description: "Same-origin browser calls, including an optional public base path."
tags:
  - name: Health
    description: Process liveness.
  - name: Session
    description: Local bearer-token role.
  - name: Users
    description: Internal user directory and GitHub identity links.
  - name: Groups
    description: Groups and membership.
  - name: Devices
    description: Viewer-readable device summaries.
  - name: Nodes
    description: "Registration, desired state, ownership, and commands."
  - name: Firmware
    description: "Catalog, flash artifacts, and compatibility."
  - name: Observations
    description: Persisted Ear observations.
  - name: Hub
    description: "Local mode, component details, and container logs."
  - name: Provisioning
    description: Device bootstrap-token exchange.
security:
  - bearerAuth: []
