  /health:
    get:
      summary: Process health check
      operationId: getHealth
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
      tags:
        - Health
      description: Unauthenticated liveness probe used by Compose and Nginx.
      security: []
