          description: "OPA, MQTT, or the Docker engine is unavailable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
      tags:
        - Nodes
      description: Admin only. Returns the new plaintext token once and revokes the previous one. Does not change MQTT credentials.
      security:
        - bearerAuth: []
  "/api/v1/nodes/{node_id}/device-api-token/revoke":
    post:
      summary: Revoke the device HTTPS API token
      operationId: revokeDeviceApiToken
      parameters:
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            title: Node Id
      responses:
        "204":
          description: Successful Response
        "401":
          description: Missing or invalid local bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: "Authenticated, but OPA denied the action."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: The request conflicts with current Hub state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: "OPA, MQTT, or the Docker engine is unavailable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
      tags:
        - Nodes
      description: Admin only. Clears the stored hash. Does not reopen provisioning and does not change MQTT credentials.
      security:
        - bearerAuth: []
  "/api/v1/nodes/{node_id}/recovery-provision":
    post:
      summary: Open an authorized re-provision
      operationId: openRecoveryProvision
      parameters:
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            title: Node Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapTokenResponse"
        "401":
          description: Missing or invalid local bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: "Authenticated, but OPA denied the action."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: The request conflicts with current Hub state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: "OPA, MQTT, or the Docker engine is unavailable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
      tags:
        - Nodes
      description: Admin only. Issues a one-time bootstrap token for a device that is already provisioned. The following POST /api/v1/provision rotates the device API token and the MQTT password. This is not ordinary firmware reflashing.
      security:
        - bearerAuth: []
  /api/v1/provision:
    post:
      summary: Exchange a bootstrap token for MQTT credentials
      operationId: provisionNode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionRequest"
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResponse"
        "400":
          description: Bad request. Used by device provisioning when the bootstrap token is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: The request conflicts with current Hub state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "503":
          description: "OPA, MQTT, or the Docker engine is unavailable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
      tags:
        - Provisioning
      description: "Device-facing. Authenticates with the one-time bootstrap token in the JSON body, not a bearer token. Initial provisioning is only accepted while the node is pending. An already provisioned node requires an admin recovery bootstrap. The response includes a one-time device API token. MQTT password handling is unchanged."
      security: []
