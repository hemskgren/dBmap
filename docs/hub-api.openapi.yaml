          properties:
            compatibility:
              $ref: "#/components/schemas/FirmwareCompatibility"
    FirmwareSelectionResult:
      allOf:
        - $ref: "#/components/schemas/CompatibleFirmwareEntry"
        - type: object
          properties:
            device_id:
              type: string
    FlashManifestPart:
      type: object
      required:
        - path
        - offset
      properties:
        path:
          type: string
        offset:
          type: integer
    FlashManifestBuild:
      type: object
      required:
        - chipFamily
        - parts
      properties:
        chipFamily:
          type: string
          example: ESP32
        parts:
          type: array
          items:
            $ref: "#/components/schemas/FlashManifestPart"
    FlashManifest:
      type: object
      required:
        - name
        - version
        - builds
      properties:
        name:
          type: string
        version:
          type: string
        new_install_prompt_erase:
          type: boolean
        new_install_improv_wait_time:
          type: integer
        builds:
          type: array
          items:
            $ref: "#/components/schemas/FlashManifestBuild"
    DeploymentAttemptEvent:
      type: object
      properties:
        status:
          type: string
        stage:
          type: string
        progress_percent:
          type: integer
          nullable: true
        failure_code:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    DeploymentAttempt:
      type: object
      required:
        - attempt_id
        - node_id
        - firmware_id
        - status
        - stage
        - events
      properties:
        attempt_id:
          type: string
        node_id:
          type: string
        firmware_id:
          type: string
        firmware_version:
          type: string
        artifact_sha256:
          type: string
        status:
          type: string
          enum:
            - in_progress
            - succeeded
            - failed
            - unknown
        stage:
          type: string
        progress_percent:
          type: integer
          nullable: true
        failure_code:
          type: string
          nullable: true
        initiated_by:
          type: string
        flasher_version:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        events:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentAttemptEvent"
    MqttAddress:
      type: object
      properties:
        host:
          type: string
        port:
          type: integer
        use_tls:
          type: boolean
    HubAddresses:
      type: object
      properties:
        local_hub_url:
          type: string
        external_hub_url:
          type: string
          nullable: true
        local_mqtt:
          $ref: "#/components/schemas/MqttAddress"
        external_mqtt:
          allOf:
            - $ref: "#/components/schemas/MqttAddress"
          nullable: true
    HubComponent:
      type: object
      required:
        - id
        - name
        - status
        - logs
      properties:
        id:
          type: string
          enum:
            - nginx
            - web
            - hub-api
            - database
            - opa
            - mosquitto
            - firmware-builder
        name:
          type: string
        status:
          type: string
        logs:
          type: boolean
    HubSummary:
      type: object
      properties:
        device_count:
          type: integer
        devices_by_type:
          type: object
          additionalProperties:
            type: integer
        devices_by_lifecycle:
          type: object
          additionalProperties:
            type: integer
        devices_by_availability:
          type: object
          additionalProperties:
            type: integer
        online_device_count:
          type: integer
        installation_completed_count:
          type: integer
        installation_incomplete_count:
          type: integer
        observation_count:
          type: integer
        observation_limit:
          type: integer
        latest_observation_at:
          type: string
          format: date-time
          nullable: true
    HubMonitoringComponent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        state:
          type: string
        last_success_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          nullable: true
        docker:
          type: object
          additionalProperties: true
          nullable: true
    HubAvailabilityWindow:
      type: object
      properties:
        percent:
          type: number
          nullable: true
        state_summary:
          type: string
        eligible_seconds:
          type: integer
        available_seconds:
          type: integer
        unavailable_seconds:
          type: integer
        unobserved_seconds:
          type: integer
        not_running_seconds:
          type: integer
          description: Seconds the Hub monitor was not running inside this window. A stopped Hub container and a powered-off computer are both recorded this way and are excluded from the percentage.
        sample_count:
          type: integer
        insufficient_data:
          type: boolean
        low_coverage:
          type: boolean
        score_ready:
          type: boolean
          description: False for multi-day windows until at least half the window has been observed. UIs should not show a bare window percentage until ready.
        reason:
          type: string
          nullable: true
        basis:
          type: string
    HubMonitorEvent:
      type: object
      properties:
        event_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        component:
          type: string
        event_type:
          type: string
        previous_state:
          type: string
          nullable: true
        new_state:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        source:
          type: string
        certainty:
          type: string
          enum:
            - confirmed
            - inferred
    HubMonitoringEvents:
      type: object
      required:
        - events
        - limit
        - count
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/HubMonitorEvent"
        limit:
          type: integer
          example: 15
        count:
          type: integer
    HubMonitoring:
      type: object
      description: Local Hub health and availability. See docs/health-and-availability.md.
      properties:
        health:
          type: object
          properties:
            state:
              type: string
            score:
              type: integer
              nullable: true
            score_definition:
              type: object
              additionalProperties: true
            reason:
              type: string
              nullable: true
              description: Plain-language cause when health is not healthy.
            components:
              type: array
              items:
                $ref: "#/components/schemas/HubMonitoringComponent"
            calculated_at:
              type: string
              format: date-time
            notes:
              type: string
        availability:
          type: object
          description: Core Hub availability plus independent MQTT/API/Web windows. Firmware Builder is excluded. See docs/health-and-availability.md.
          properties:
            current_state:
              type: string
            label:
              type: string
              example: Core Hub availability
            definition:
              type: string
            windows:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/HubAvailabilityWindow"
            components:
              type: object
              description: "Independent MQTT, API, and Web availability windows."
              additionalProperties:
                type: object
                properties:
                  label:
                    type: string
                  windows:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/HubAvailabilityWindow"
            insufficient_data:
              type: boolean
            gaps:
              type: array
              items:
                type: object
                additionalProperties: true
            retention_days:
              type: integer
            interval_seconds:
              type: number
            notes:
              type: string
        last_checks:
          type: object
          additionalProperties: true
        last_state_change:
          type: object
          additionalProperties: true
          nullable: true
        recent_events:
          type: array
          items:
            $ref: "#/components/schemas/HubMonitorEvent"
          description: Empty on status responses; use GET /api/v1/hub/monitoring/events.
        events_endpoint:
          type: string
          example: /api/v1/hub/monitoring/events
        sample_count:
          type: integer
    HubStatus:
      type: object
      required:
        - mode
        - hub_id
        - addresses
        - components
        - summary
        - monitoring
      properties:
        mode:
          type: string
          example: Local Hub
        hub_id:
          type: string
        addresses:
          $ref: "#/components/schemas/HubAddresses"
        components:
          type: array
          items:
            $ref: "#/components/schemas/HubComponent"
        summary:
          $ref: "#/components/schemas/HubSummary"
        monitoring:
          $ref: "#/components/schemas/HubMonitoring"
    HubComponentDetails:
      type: object
      additionalProperties: true
      description: Shape depends on the component. Common fields include service and status.
      properties:
        service:
          type: string
        status:
          type: string
    HubComponentLogs:
      type: object
      required:
        - service
        - compose_service
        - lines
        - line_limit
      properties:
        service:
          type: string
        compose_service:
          type: string
        lines:
          type: array
          items:
            type: string
        line_limit:
          type: integer
          example: 15
    HubComponentConnectionFailures:
      type: object
      required:
        - service
        - compose_service
        - window_hours
        - source
        - lines
        - count
        - notices
      properties:
        service:
          type: string
        compose_service:
          type: string
          example: mosquitto
        window_hours:
          type: integer
          example: 3
        source:
          type: string
          enum:
            - file
            - unavailable
        path:
          type: string
        lines:
          type: array
          items:
            type: string
        count:
          type: integer
        notices:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Local `DBMAP_ADMIN_TOKEN` or `DBMAP_VIEWER_TOKEN`. OPA then decides the action.
    deviceApiAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Device API token from provisioning or admin rotation. The Hub hashes it and does not call OPA.
servers:
  - url: https://hub.local:8443
    description: Default local Hub URL through Nginx. Replace host and port from .env.
  - url: /
    description: "Same-origin browser calls, including an optional public base path."
tags:
  - name: Health
    description: Process liveness.
  - name: Session
    description: Local bearer-token role.
  - name: Users
    description: Internal user directory and GitHub identity links.
  - name: Groups
    description: Groups and membership.
  - name: Devices
    description: Viewer-readable device summaries.
  - name: Nodes
    description: "Registration, desired state, ownership, and commands."
  - name: Firmware
    description: "Catalog, flash artifacts, and compatibility."
  - name: Observations
    description: Persisted Ear observations.
  - name: Hub
    description: "Local mode, component details, and container logs."
  - name: Provisioning
    description: Device bootstrap-token exchange.
security:
  - bearerAuth: []
