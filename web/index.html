<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dBmap</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
      }
      main {
        width: min(860px, calc(100vw - 2rem));
        padding: 2rem;
        border: 1px solid rgba(148, 163, 184, 0.38);
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.82);
        box-shadow: 0 12px 48px rgba(15, 23, 42, 0.45);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p {
        margin: 0.5rem 0;
        color: #cbd5e1;
      }
      .status {
        display: inline-block;
        margin: 1rem 0 0.5rem;
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        font-weight: 600;
        background: rgba(34, 197, 94, 0.15);
        color: #bbf7d0;
        border: 1px solid rgba(34, 197, 94, 0.35);
      }
      .status.error {
        background: rgba(248, 113, 113, 0.12);
        color: #fecaca;
        border-color: rgba(248, 113, 113, 0.35);
      }
      code {
        font-family: "SFMono-Regular", ui-monospace, monospace;
      }
      ul {
        margin: 1rem 0 0;
        padding-left: 1.2rem;
        color: #cbd5e1;
      }
      li + li {
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>dBmap</h1>
      <p>Minimal web UI for the local deployment.</p>
      <div id="status" class="status">Checking backend status…</div>
      <p id="detail">The edge proxy routes browser traffic to this UI and forwards API traffic to the Hub API.</p>
      <ul>
        <li>Frontend routes: <code>/</code></li>
        <li>API routes: <code>/api/…</code></li>
        <li>Authorization remains enforced by the backend API.</li>
      </ul>
    </main>
    <script>
      async function refreshStatus() {
        const statusNode = document.getElementById('status');
        const detailNode = document.getElementById('detail');

        try {
          const response = await fetch('/health', { cache: 'no-store' });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.detail || 'The Hub API is not reachable.');
          }

          statusNode.textContent = `API online: ${payload.status}`;
          statusNode.classList.remove('error');
          detailNode.textContent = `Service: ${payload.service}`;
        } catch (error) {
          statusNode.textContent = 'Backend unavailable';
          statusNode.classList.add('error');
          detailNode.textContent = error.message || 'The dBmap API is not responding through the proxy.';
        }
      }

      refreshStatus();
    </script>
  </body>
</html>
