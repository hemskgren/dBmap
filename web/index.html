<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dBmap devices</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f3f6fa;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem max(1.25rem, calc((100vw - 1100px) / 2));
        color: #f8fafc;
        background: #14223b;
      }
      header h1 { margin: 0; font-size: 1.35rem; }
      header p { margin: 0.2rem 0 0; color: #cbd5e1; font-size: 0.9rem; }
      main { width: min(1100px, calc(100vw - 2rem)); margin: 2rem auto; }
      section, article {
        border: 1px solid #d8e0eb;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 4px 16px rgb(15 23 42 / 5%);
      }
      .login { width: min(480px, 100%); margin: 8vh auto; padding: 1.5rem; }
      .login h2, section h2 { margin-top: 0; }
      label { display: block; margin: 0.8rem 0 0.35rem; font-weight: 600; }
      input, select, button { font: inherit; }
      input, select {
        width: 100%; padding: 0.65rem 0.75rem; border: 1px solid #aab7c9; border-radius: 7px;
      }
      button {
        border: 0; border-radius: 7px; padding: 0.62rem 0.9rem; cursor: pointer;
        color: #fff; background: #2457a7; font-weight: 600;
      }
      button.secondary { color: #183153; background: #e6edf7; }
      button.danger { background: #a83232; }
      button:disabled { cursor: wait; opacity: 0.65; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
      .toolbar h2 { margin: 0; }
      .grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr); gap: 1rem; }
      section { padding: 1.25rem; min-width: 0; }
      #device-list { display: grid; gap: 0.75rem; }
      article { padding: 1rem; box-shadow: none; }
      article h3 { margin: 0 0 0.5rem; }
      .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem 0.75rem; margin: 0; }
      .meta dt { color: #526078; }
      .meta dd { margin: 0; overflow-wrap: anywhere; }
      .online { color: #157347; font-weight: 700; }
      .offline { color: #a83232; font-weight: 700; }
      .actions { display: flex; gap: 0.5rem; margin-top: 0.85rem; }
      .notice { min-height: 1.5rem; margin: 0.6rem 0; color: #526078; }
      .error { color: #a83232; }
      #map {
        display: block; width: 100%; min-height: 280px; border-radius: 8px;
        background: linear-gradient(#f8fafc, #edf3f9); border: 1px solid #d8e0eb;
      }
      #map text { font: 12px system-ui, sans-serif; fill: #526078; }
      #map circle { fill: #2457a7; stroke: #fff; stroke-width: 3; }
      #map circle.offline-marker { fill: #a83232; }
      .map-note { color: #526078; font-size: 0.88rem; }
      #create-panel { display: flex; align-items: end; gap: 0.6rem; margin: 1rem 0; }
      #create-panel label { flex: 1; margin: 0; }
      #created-token { padding: 0.8rem; border-radius: 7px; background: #fff7d6; overflow-wrap: anywhere; }
      [hidden] { display: none !important; }
      @media (max-width: 760px) {
        .grid { grid-template-columns: 1fr; }
        .toolbar { align-items: flex-start; }
        #create-panel { align-items: stretch; flex-direction: column; }
        header { padding: 1rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>dBmap</h1>
        <p>Local device overview</p>
      </div>
      <div id="user-controls" hidden>
        <span id="role-label"></span>
        <button id="logout" class="secondary" type="button">Sign out</button>
      </div>
    </header>
    <main>
      <section id="login-panel" class="login">
        <h2>Local access</h2>
        <p>Enter the access token supplied by your dBmap administrator.</p>
        <form id="login-form">
          <label for="access-token">Access token</label>
          <input id="access-token" type="password" autocomplete="current-password" required />
          <p id="login-message" class="notice" role="status"></p>
          <button type="submit">Sign in</button>
        </form>
      </section>
      <div id="dashboard" hidden>
        <div class="toolbar">
          <div>
            <h2>Devices</h2>
            <p id="refresh-status" class="notice" aria-live="polite"></p>
          </div>
          <button id="refresh" class="secondary" type="button">Refresh</button>
        </div>
        <section id="admin-panel" hidden>
          <h2>Local administration</h2>
          <form id="create-panel">
            <label for="node-type">Register device
              <select id="node-type">
                <option value="ear">Ear</option>
                <option value="output">Output</option>
              </select>
            </label>
            <button type="submit">Create device</button>
          </form>
          <div id="created-token" hidden role="status"></div>
        </section>
        <div class="grid">
          <section>
            <h2>Device list</h2>
            <div id="device-list" aria-live="polite"></div>
          </section>
          <section>
            <h2>Site map</h2>
            <svg id="map" viewBox="0 0 800 400" role="img" aria-label="Map of device installation positions"></svg>
            <p class="map-note">Installation coordinates are plotted from WGS84 latitude and longitude. No external map service is used.</p>
          </section>
        </div>
      </div>
    </main>
    <script>
      const authToken = { value: '' };
      let currentRole = '';
      let refreshTimer;
      const svgNamespace = 'http://www.w3.org/2000/svg';

      async function api(path, options = {}) {
        const headers = new Headers(options.headers || {});
        headers.set('Authorization', `Bearer ${authToken.value}`);
        if (options.body) headers.set('Content-Type', 'application/json');
        const response = await fetch(path, { ...options, headers, cache: 'no-store' });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.detail || `Request failed (${response.status}).`);
        return body;
      }

      function el(tag, text, className) {
        const node = document.createElement(tag);
        if (text !== undefined) node.textContent = text;
        if (className) node.className = className;
        return node;
      }

      function formatSeen(value) {
        if (!value) return 'Never';
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? 'Unknown' : date.toLocaleString();
      }

      function drawMap(devices) {
        const map = document.getElementById('map');
        map.replaceChildren();
        const positions = devices.filter((device) => device.installation);
        if (!positions.length) {
          const message = document.createElementNS(svgNamespace, 'text');
          message.setAttribute('x', '400');
          message.setAttribute('y', '205');
          message.setAttribute('text-anchor', 'middle');
          message.textContent = 'No devices have installation coordinates';
          map.append(message);
          return;
        }

        const latitudes = positions.map((device) => device.installation.latitude);
        const longitudes = positions.map((device) => device.installation.longitude);
        const latRange = Math.max(Math.max(...latitudes) - Math.min(...latitudes), 0.02);
        const lonRange = Math.max(Math.max(...longitudes) - Math.min(...longitudes), 0.02);
        const latMin = Math.min(...latitudes) - latRange * 0.1;
        const lonMin = Math.min(...longitudes) - lonRange * 0.1;
        const latMax = Math.max(...latitudes) + latRange * 0.1;
        const lonMax = Math.max(...longitudes) + lonRange * 0.1;

        for (let i = 0; i < 5; i += 1) {
          const y = 45 + i * 75;
          const x = 50 + i * 175;
          const horizontal = document.createElementNS(svgNamespace, 'line');
          horizontal.setAttribute('x1', '50');
          horizontal.setAttribute('x2', '750');
          horizontal.setAttribute('y1', String(y));
          horizontal.setAttribute('y2', String(y));
          horizontal.setAttribute('stroke', '#d8e0eb');
          map.append(horizontal);
          const vertical = document.createElementNS(svgNamespace, 'line');
          vertical.setAttribute('x1', String(x));
          vertical.setAttribute('x2', String(x));
          vertical.setAttribute('y1', '45');
          vertical.setAttribute('y2', '345');
          vertical.setAttribute('stroke', '#d8e0eb');
          map.append(vertical);
        }

        for (const device of positions) {
          const x = 75 + ((device.installation.longitude - lonMin) / (lonMax - lonMin)) * 650;
          const y = 335 - ((device.installation.latitude - latMin) / (latMax - latMin)) * 280;
          const marker = document.createElementNS(svgNamespace, 'circle');
          marker.setAttribute('cx', String(x));
          marker.setAttribute('cy', String(y));
          marker.setAttribute('r', '9');
          marker.setAttribute('class', device.status === 'online' ? '' : 'offline-marker');
          map.append(marker);
          const label = document.createElementNS(svgNamespace, 'text');
          label.setAttribute('x', String(x + 12));
          label.setAttribute('y', String(y + 4));
          label.textContent = device.node_id;
          map.append(label);
        }
      }

      function renderDevices(devices) {
        const list = document.getElementById('device-list');
        list.replaceChildren();
        if (!devices.length) {
          list.append(el('p', 'No devices are registered yet.'));
        }

        for (const device of devices) {
          const card = el('article');
          card.append(el('h3', `${device.node_id} · ${device.node_type.toUpperCase()}`));
          const details = el('dl', undefined, 'meta');
          const fields = [
            ['Status', device.status, device.status],
            ['Lifecycle', device.lifecycle_state],
            ['Provisioning', device.provisioning_state],
            ['Hardware', device.hardware_revision],
            ['Last seen', formatSeen(device.last_seen_at)],
            ['Location', device.installation
              ? `${device.installation.latitude}, ${device.installation.longitude}`
              : 'Not set'],
          ];
          for (const [label, value, statusClass] of fields) {
            details.append(el('dt', label));
            details.append(el('dd', value, statusClass === 'online' || statusClass === 'offline' ? statusClass : ''));
          }
          card.append(details);
          if (currentRole === 'admin') {
            const actions = el('div', undefined, 'actions');
            const toggle = el('button', device.lifecycle_state === 'active' ? 'Deactivate' : 'Reactivate');
            toggle.type = 'button';
            if (device.lifecycle_state === 'active') toggle.className = 'danger';
            toggle.addEventListener('click', async () => {
              toggle.disabled = true;
              try {
                const lifecycle_state = device.lifecycle_state === 'active' ? 'deactivated' : 'active';
                await api(`/api/v1/nodes/${encodeURIComponent(device.node_id)}/lifecycle`, {
                  method: 'PUT',
                  body: JSON.stringify({ lifecycle_state }),
                });
                await refreshDevices();
              } catch (error) {
                showStatus(error.message, true);
              } finally {
                toggle.disabled = false;
              }
            });
            actions.append(toggle);
            card.append(actions);
          }
          list.append(card);
        }
        drawMap(devices);
      }

      function showStatus(message, isError = false) {
        const status = document.getElementById('refresh-status');
        status.textContent = message;
        status.className = isError ? 'notice error' : 'notice';
      }

      async function refreshDevices() {
        try {
          const devices = await api('/api/v1/devices');
          renderDevices(devices);
          showStatus(`Updated ${new Date().toLocaleTimeString()}`);
        } catch (error) {
          showStatus(error.message, true);
        }
      }

      function showDashboard(role) {
        currentRole = role;
        document.getElementById('login-panel').hidden = true;
        document.getElementById('dashboard').hidden = false;
        document.getElementById('user-controls').hidden = false;
        document.getElementById('admin-panel').hidden = role !== 'admin';
        document.getElementById('role-label').textContent = `${role} access`;
        refreshDevices();
        refreshTimer = window.setInterval(refreshDevices, 30000);
      }

      document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = document.getElementById('login-message');
        const submit = event.currentTarget.querySelector('button[type="submit"]');
        authToken.value = document.getElementById('access-token').value;
        submit.disabled = true;
        message.textContent = 'Checking access…';
        message.className = 'notice';
        try {
          const session = await api('/api/v1/session');
          document.getElementById('access-token').value = '';
          showDashboard(session.role);
        } catch (error) {
          authToken.value = '';
          message.textContent = error.message;
          message.className = 'notice error';
        } finally {
          submit.disabled = false;
        }
      });

      document.getElementById('create-panel').addEventListener('submit', async (event) => {
        event.preventDefault();
        const submit = event.currentTarget.querySelector('button[type="submit"]');
        const tokenBox = document.getElementById('created-token');
        submit.disabled = true;
        tokenBox.hidden = true;
        try {
          const created = await api('/api/v1/nodes', {
            method: 'POST',
            body: JSON.stringify({
              node_type: document.getElementById('node-type').value,
              hardware_revision: 'unknown',
            }),
          });
          tokenBox.replaceChildren(
            el('strong', `Created ${created.node_id}. Save this one-time bootstrap token now: `),
            el('code', created.bootstrap_token),
          );
          tokenBox.hidden = false;
          await refreshDevices();
        } catch (error) {
          showStatus(error.message, true);
        } finally {
          submit.disabled = false;
        }
      });

      document.getElementById('refresh').addEventListener('click', refreshDevices);
      document.getElementById('logout').addEventListener('click', () => {
        window.clearInterval(refreshTimer);
        authToken.value = '';
        currentRole = '';
        document.getElementById('dashboard').hidden = true;
        document.getElementById('admin-panel').hidden = true;
        document.getElementById('user-controls').hidden = true;
        const createdToken = document.getElementById('created-token');
        createdToken.hidden = true;
        createdToken.replaceChildren();
        document.getElementById('device-list').replaceChildren();
        document.getElementById('map').replaceChildren();
        document.getElementById('login-panel').hidden = false;
      });
    </script>
  </body>
</html>
