<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dBmap · Map</title>
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #526078;
        --line: #d8e0eb;
        --panel: #fff;
        --online: #1f7a4d;
        --offline: #8a5a12;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
        font: 15px/1.45 system-ui, sans-serif;
        color: var(--ink);
        background: #eef2f7;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem 0.55rem;
        padding: 0.4rem 0.75rem;
        border-bottom: 1px solid var(--line);
        background: #14223b;
        color: #f8fafc;
      }
      header h1 {
        margin: 0; font-size: 0.98rem; font-weight: 700; letter-spacing: 0.02em;
        flex: 0 0 auto;
      }
      header .view-cluster {
        display: flex; align-items: center; gap: 0.45rem; min-width: 0; flex: 1 1 auto;
      }
      header .actions {
        margin-left: auto; display: flex; gap: 0.4rem; align-items: center;
        flex: 0 0 auto; flex-wrap: nowrap;
      }
      button {
        border: 0; border-radius: 6px; padding: 0.28rem 0.55rem; cursor: pointer;
        color: #fff; background: #2457a7; font: inherit; font-size: 0.82rem; font-weight: 600;
      }
      button.secondary { color: #183153; background: #e6edf7; }
      #view-select {
        border: 1px solid #334155; border-radius: 6px; padding: 0.22rem 0.4rem;
        background: #0f172a; color: #f8fafc; font: inherit; font-size: 0.8rem;
        max-width: 11rem; flex: 0 0 auto;
      }
      #view-meta {
        color: #94a3b8; font-size: 0.8rem; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; min-width: 0;
      }
      #status {
        color: #94a3b8; font-size: 0.8rem; white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      #map { width: 100%; height: 100%; min-height: 320px; }
      .notice {
        margin: 1rem; padding: 0.85rem 1rem; border: 1px solid var(--line);
        border-radius: 10px; background: var(--panel); color: var(--muted);
      }
      .notice.error { color: #8b1e2d; border-color: #f0c4cb; background: #fff5f6; }
      .popup-title { font-weight: 700; margin: 0; font-size: 0.95rem; line-height: 1.25; }
      .popup-meta { margin: 0.1rem 0 0; color: var(--muted); font-size: 0.88rem; font-variant-numeric: tabular-nums; }
      .popup-section { margin: 0.4rem 0 0; }
      .popup-section-title {
        margin: 0 0 0.12rem; font-size: 0.72rem; font-weight: 700;
        letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted);
      }
      .popup-row { margin: 0.06rem 0; font-size: 0.84rem; line-height: 1.3; }
      .popup-note { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.76rem; line-height: 1.3; }
      .popup-head {
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 0.5rem; margin: 0;
      }
      .popup-copy {
        flex: 0 0 auto; margin: 0; padding: 0.15rem 0.45rem;
        border: 1px solid var(--line); border-radius: 6px;
        background: #f8fafc; color: var(--ink); font: inherit; font-size: 0.75rem;
        font-weight: 650; cursor: pointer; line-height: 1.2;
      }
      .popup-copy:hover { background: #eef2f7; }
      .popup-copy.is-copied { border-color: #86efac; background: #f0fdf4; }
      .analysis-popup { max-width: 18rem; }
      .status-online { color: var(--online); font-weight: 650; }
      .status-offline { color: var(--offline); font-weight: 650; }
      .popup-list { margin: 0.25rem 0 0; padding-left: 1.05rem; }
      .popup-list li { margin: 0.15rem 0; }
      .leaflet-popup-content { min-width: 12rem; max-width: min(18rem, 72vw); margin: 0.55rem 0.7rem !important; }
      .leaflet-popup-content-wrapper { border-radius: 10px; }
      .legend {
        position: absolute; z-index: 500; left: 0.75rem; bottom: 2.6rem;
        max-width: min(18rem, calc(100% - 1.5rem));
        border-radius: 8px; background: rgb(255 255 255 / 94%);
        border: 1px solid var(--line); font-size: 0.82rem;
        box-shadow: 0 4px 12px rgb(15 23 42 / 10%);
        overflow: hidden;
      }
      .legend-toggle {
        display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
        width: 100%; margin: 0; border: 0; border-radius: 0; padding: 0.4rem 0.65rem;
        background: transparent; color: var(--ink); font: inherit; font-weight: 650;
        cursor: pointer; text-align: left;
      }
      .legend-toggle:hover { background: #f1f5f9; }
      .legend-toggle .chevron { color: var(--muted); font-size: 0.75rem; }
      .legend-body {
        display: none;
        padding: 0 0.65rem 0.5rem;
        border-top: 1px solid var(--line);
      }
      .legend.is-open .legend-body { display: block; }
      .legend-body > div { display: flex; align-items: center; gap: 0.4rem; margin: 0.28rem 0; }
      .legend-pin {
        width: 0.85rem; height: 1.15rem; display: inline-block; vertical-align: middle; flex: 0 0 auto;
      }
      .map-pin {
        position: relative;
        width: 28px;
        height: 40px;
      }
      .map-pin svg {
        position: relative;
        z-index: 1;
        display: block;
        width: 28px;
        height: 40px;
        filter: drop-shadow(0 1px 2px rgb(15 23 42 / 35%));
      }
      .map-pin .obs-halo {
        position: absolute;
        left: 50%;
        top: 12px;
        z-index: 0;
        width: 22px;
        height: 22px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: rgb(234 88 12 / 32%);
        box-shadow: 0 0 0 3px rgb(234 88 12 / 60%);
        pointer-events: none;
        animation: obs-pulse 1.8s ease-out infinite;
      }
      @keyframes obs-pulse {
        0% { transform: translate(-50%, -50%) scale(0.92); opacity: 1; }
        70% { transform: translate(-50%, -50%) scale(1.35); opacity: 0.35; }
        100% { transform: translate(-50%, -50%) scale(1.45); opacity: 0; }
      }
      .map-pin .count {
        position: absolute;
        z-index: 2;
        top: -0.35rem;
        right: -0.45rem;
        min-width: 1.15rem;
        height: 1.15rem;
        padding: 0 0.28rem;
        border-radius: 999px;
        background: #14223b;
        color: #fff;
        font: 700 0.72rem/1.15rem system-ui, sans-serif;
        text-align: center;
        border: 2px solid #fff;
      }
      .map-pin.has-obs .count { background: #c2410c; }
      .map-pin.is-offline svg .pin-body { opacity: 0.72; }
      .map-pin.is-offline svg .pin-stroke { stroke: #8a5a12; }
    </style>
  </head>
  <body>
    <header>
      <h1>dBmap</h1>
      <div class="view-cluster">
        <select id="view-select" aria-label="Map view">
          <option value="">Live</option>
        </select>
        <span id="view-meta" aria-live="polite"></span>
      </div>
      <div class="actions">
        <span id="status" role="status">Waiting for Hub session…</span>
        <button id="fit-view" class="secondary" type="button" hidden>Fit</button>
        <button id="refresh" class="secondary" type="button" hidden>Refresh</button>
      </div>
    </header>
    <div id="map-root">
      <p id="bootstrap-message" class="notice">
        Open this window from the signed-in Hub (Map button). It reuses your Hub login and
        <code>GET /api/v1/devices</code> plus recent observations. Basemap tiles need browser internet; Leaflet assets are local.
      </p>
    </div>
    <script src="./vendor/leaflet/leaflet.js"></script>
    <script>
      const REFRESH_MS = 60000;
      const OBSERVATION_WINDOW_MS = 15 * 60 * 1000;
      const MAP_DEMO_NAMESPACE = 'map-demo';
      const statusEl = document.getElementById('status');
      const viewMetaEl = document.getElementById('view-meta');
      const refreshBtn = document.getElementById('refresh');
      const fitViewBtn = document.getElementById('fit-view');
      const viewSelect = document.getElementById('view-select');
      const mapRoot = document.getElementById('map-root');
      let map;
      let markerLayer;
      let analysisLayer;
      let refreshTimer;
      let session = null;
      let hasFittedView = false;
      let lastBounds = [];
      let availableDatasets = [];
      let selectedDatasetId = '';
      let viewMetaNotice = '';
      let liveUpdatedAtMs = null;

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function pad2(value) {
        return String(value).padStart(2, '0');
      }

      function formatClockUtc(ms, { withSeconds = false } = {}) {
        if (!Number.isFinite(ms)) return '';
        const stamp = new Date(ms);
        const hh = pad2(stamp.getUTCHours());
        const mm = pad2(stamp.getUTCMinutes());
        if (!withSeconds) return `${hh}:${mm}Z`;
        return `${hh}:${mm}:${pad2(stamp.getUTCSeconds())}Z`;
      }

      function formatDateUtc(ms) {
        if (!Number.isFinite(ms)) return '';
        const stamp = new Date(ms);
        return `${stamp.getUTCFullYear()}-${pad2(stamp.getUTCMonth() + 1)}-${pad2(stamp.getUTCDate())}`;
      }

      function formatViewTime(iso, { withSeconds = false } = {}) {
        if (!iso || typeof iso !== 'string') return '';
        const ms = Date.parse(iso);
        if (!Number.isFinite(ms)) return iso;
        return `${formatDateUtc(ms)} ${formatClockUtc(ms, { withSeconds })}`;
      }

      function formatTimeSpan(startIso, endIso) {
        const startMs = Date.parse(startIso || '');
        const endMs = Date.parse(endIso || '');
        if (!Number.isFinite(startMs) && !Number.isFinite(endMs)) return '';
        if (!Number.isFinite(endMs) || startMs === endMs) {
          return formatViewTime(startIso || endIso);
        }
        if (!Number.isFinite(startMs)) return formatViewTime(endIso);
        const sameDay = formatDateUtc(startMs) === formatDateUtc(endMs);
        if (sameDay) {
          return `${formatDateUtc(startMs)} ${formatClockUtc(startMs)}–${formatClockUtc(endMs)}`;
        }
        return `${formatViewTime(startIso)} → ${formatViewTime(endIso)}`;
      }

      function collectLayerTimeIsos(...contents) {
        const times = [];
        for (const content of contents) {
          if (!content || typeof content !== 'object') continue;
          for (const point of content.points || []) {
            if (point && typeof point.time_utc === 'string' && point.time_utc) {
              times.push(point.time_utc);
            }
          }
          for (const key of ['observations', 'events', 'localizations']) {
            for (const item of content[key] || []) {
              if (item && typeof item.time_utc === 'string' && item.time_utc) {
                times.push(item.time_utc);
              }
            }
          }
        }
        return times;
      }

      function layerTimeSpan(times) {
        if (!times.length) return { startUtc: '', endUtc: '' };
        let startMs = Infinity;
        let endMs = -Infinity;
        let startUtc = '';
        let endUtc = '';
        for (const iso of times) {
          const ms = Date.parse(iso);
          if (!Number.isFinite(ms)) continue;
          if (ms < startMs) {
            startMs = ms;
            startUtc = iso;
          }
          if (ms > endMs) {
            endMs = ms;
            endUtc = iso;
          }
        }
        return { startUtc, endUtc };
      }

      function setViewMeta({ title = '', startUtc = '', endUtc = '', notice = '' } = {}) {
        if (notice) {
          viewMetaEl.textContent = notice;
          return;
        }
        if (!title) {
          const updated = liveUpdatedAtMs == null
            ? ''
            : formatClockUtc(liveUpdatedAtMs, { withSeconds: true });
          viewMetaEl.textContent = updated
            ? `Live · updated ${updated}`
            : 'Live · waiting for update';
          return;
        }
        const span = formatTimeSpan(startUtc, endUtc);
        viewMetaEl.textContent = span ? `${title} · ${span}` : title;
      }

      function syncViewMetaFromSelection() {
        if (viewMetaNotice) {
          setViewMeta({ notice: viewMetaNotice });
          return;
        }
        if (!selectedDatasetId) {
          setViewMeta({});
          return;
        }
        const dataset = availableDatasets.find((item) => item.id === selectedDatasetId);
        if (!dataset) {
          setViewMeta({ notice: 'Selected view expired or unavailable' });
          return;
        }
        setViewMeta({
          title: dataset.title,
          startUtc: dataset.timeStartUtc || dataset.runTimestampUtc || '',
          endUtc: dataset.timeEndUtc || dataset.timeStartUtc || dataset.runTimestampUtc || '',
        });
      }

      function readSessionFromOpener() {
        try {
          if (!window.opener || window.opener.closed) return null;
          if (typeof window.opener.dbmapGetMapSession !== 'function') return null;
          const next = window.opener.dbmapGetMapSession();
          if (!next || typeof next.token !== 'string' || !next.token) return null;
          return {
            token: next.token,
            basePath: typeof next.basePath === 'string' ? next.basePath : '',
          };
        } catch (_) {
          return null;
        }
      }

      function ensureSession() {
        const next = readSessionFromOpener();
        if (next) session = next;
        return session;
      }

      function formatSeen(value) {
        if (!value) return 'never';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleString();
      }

      const TYPE_COLORS = {
        ear: '#2457a7',
        output: '#b45309',
        mixed: '#5b21b6',
        other: '#475569',
      };

      function normalizeType(value) {
        const type = String(value || '').toLowerCase();
        if (type === 'ear' || type === 'output') return type;
        return 'other';
      }

      function mappableDevices(devices) {
        return devices.filter((device) => {
          if (!device || typeof device !== 'object') return false;
          if (String(device.lifecycle_state || 'active') !== 'active') return false;
          const installation = device.installation;
          if (!installation || typeof installation !== 'object') return false;
          const lat = Number(installation.latitude);
          const lon = Number(installation.longitude);
          return Number.isFinite(lat) && Number.isFinite(lon);
        });
      }

      function coordKey(lat, lon) {
        return `${lat.toFixed(6)},${lon.toFixed(6)}`;
      }

      function groupDevicesByCoordinate(devices) {
        const groups = new Map();
        for (const device of devices) {
          const lat = Number(device.installation.latitude);
          const lon = Number(device.installation.longitude);
          const key = coordKey(lat, lon);
          let group = groups.get(key);
          if (!group) {
            group = { lat, lon, devices: [] };
            groups.set(key, group);
          }
          group.devices.push(device);
        }
        for (const group of groups.values()) {
          group.devices.sort((a, b) => String(a.node_id || '').localeCompare(String(b.node_id || '')));
        }
        return [...groups.values()];
      }

      function groupKind(devices) {
        const types = new Set(devices.map((device) => normalizeType(device.node_type)));
        if (types.size === 1) return [...types][0];
        return 'mixed';
      }

      function groupOnline(devices) {
        return devices.some((device) => device.status === 'online');
      }

      function pinGlyph(kind) {
        if (kind === 'ear') {
          return '<circle cx="14" cy="13" r="4.2" fill="#fff"/><path d="M10.2 13.2c0-2.4 1.5-4.2 3.8-4.2" fill="none" stroke="#2457a7" stroke-width="1.6" stroke-linecap="round"/>';
        }
        if (kind === 'output') {
          return '<rect x="10.2" y="9.4" width="4.2" height="7.2" rx="1" fill="#fff"/><path d="M15.2 11.2l3.2-1.6v8.8l-3.2-1.6" fill="#fff"/>';
        }
        if (kind === 'mixed') {
          return '<text x="14" y="16.2" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="system-ui,sans-serif">+</text>';
        }
        return '<text x="14" y="16.2" text-anchor="middle" fill="#fff" font-size="10" font-weight="700" font-family="system-ui,sans-serif">?</text>';
      }

      function needleIcon(kind, online, { deviceCount = 1, obsCount = 0 } = {}) {
        const fill = TYPE_COLORS[kind] || TYPE_COLORS.other;
        const hasObs = obsCount > 0;
        const offlineClass = online ? '' : ' is-offline';
        const obsClass = hasObs ? ' has-obs' : '';
        // Multi-device sites: device count. Single device with obs: observation count.
        const badge = deviceCount > 1 ? deviceCount : (hasObs ? obsCount : 0);
        const countHtml = badge > 0 ? `<span class="count">${badge}</span>` : '';
        const haloHtml = hasObs ? '<span class="obs-halo" aria-hidden="true"></span>' : '';
        const html = `
          <div class="map-pin${offlineClass}${obsClass}" title="">
            ${haloHtml}
            <svg viewBox="0 0 28 40" aria-hidden="true">
              <path class="pin-body" d="M14 1.8c-6.2 0-11.2 5-11.2 11.2 0 8.4 11.2 24.2 11.2 24.2S25.2 21.4 25.2 13C25.2 6.8 20.2 1.8 14 1.8z" fill="${fill}"/>
              <path class="pin-stroke" d="M14 1.8c-6.2 0-11.2 5-11.2 11.2 0 8.4 11.2 24.2 11.2 24.2S25.2 21.4 25.2 13C25.2 6.8 20.2 1.8 14 1.8z" fill="none" stroke="#fff" stroke-width="1.6"/>
              ${pinGlyph(kind)}
            </svg>
            ${countHtml}
          </div>`;
        return L.divIcon({
          className: '',
          iconSize: [28, 40],
          iconAnchor: [14, 40],
          popupAnchor: [0, -34],
          html,
        });
      }

      function legendPin(kind) {
        const fill = TYPE_COLORS[kind] || TYPE_COLORS.other;
        return `<svg class="legend-pin" viewBox="0 0 28 40" aria-hidden="true"><path d="M14 1.8c-6.2 0-11.2 5-11.2 11.2 0 8.4 11.2 24.2 11.2 24.2S25.2 21.4 25.2 13C25.2 6.8 20.2 1.8 14 1.8z" fill="${fill}" stroke="#fff" stroke-width="1.6"/></svg>`;
      }

      function initMap() {
        mapRoot.replaceChildren();
        const mapEl = document.createElement('div');
        mapEl.id = 'map';
        mapRoot.append(mapEl);
        const legend = document.createElement('div');
        legend.className = 'legend';
        legend.innerHTML = [
          '<button type="button" class="legend-toggle" aria-expanded="false" aria-controls="map-legend-body">',
          '<span>Legend</span><span class="chevron" aria-hidden="true">▸</span>',
          '</button>',
          '<div id="map-legend-body" class="legend-body" hidden>',
          `<div>${legendPin('ear')} Ear</div>`,
          `<div>${legendPin('output')} Output</div>`,
          `<div>${legendPin('mixed')} Mixed site (device-count badge)</div>`,
          '<div>Orange pulse = obs in last 15 min</div>',
          '<div>Orange badge = observation count</div>',
          '<div>Dimmed pin = all offline</div>',
          '<div style="margin-top:0.35rem;padding-top:0.35rem;border-top:1px solid #d8e0eb">Analysis overlay</div>',
          '<div>Green dashed = ground-truth route</div>',
          '<div>Blue circle = Observation (EAR install)</div>',
          '<div>Orange circle = Event (published estimate when available)</div>',
          '<div>Purple diamond = Estimated localization (not ground truth)</div>',
          '</div>',
        ].join('');
        const legendToggle = legend.querySelector('.legend-toggle');
        const legendBody = legend.querySelector('.legend-body');
        const legendChevron = legend.querySelector('.chevron');
        const LEGEND_OPEN_KEY = 'dbmap.map.legendOpen';
        const setLegendOpen = (open) => {
          legend.classList.toggle('is-open', open);
          legendBody.hidden = !open;
          legendToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          legendChevron.textContent = open ? '▾' : '▸';
          try { sessionStorage.setItem(LEGEND_OPEN_KEY, open ? '1' : '0'); } catch (_) { /* ignore */ }
        };
        legendToggle.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          setLegendOpen(!legend.classList.contains('is-open'));
        });
        let startOpen = false;
        try { startOpen = sessionStorage.getItem(LEGEND_OPEN_KEY) === '1'; } catch (_) { /* ignore */ }
        setLegendOpen(startOpen);
        mapRoot.append(legend);
        mapRoot.style.position = 'relative';

        map = L.map(mapEl, { worldCopyJump: true });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        }).addTo(map);
        L.control.scale({
          metric: true,
          imperial: false,
          position: 'bottomleft',
        }).addTo(map);
        markerLayer = L.layerGroup().addTo(map);
        analysisLayer = L.layerGroup().addTo(map);
        wireAnalysisPopupCopy(map);
        map.setView([59.91, 10.75], 6);
        refreshBtn.hidden = false;
        fitViewBtn.hidden = false;
      }

      function clearAnalysisOverlays() {
        if (analysisLayer) analysisLayer.clearLayers();
      }

      const ANALYSIS_POPUP_OPTS = {
        maxWidth: 288,
        maxHeight: 260,
        autoPanPadding: [16, 16],
        className: 'analysis-leaflet-popup',
      };

      function circleMarker(lat, lon, options, popupHtml) {
        const marker = L.circleMarker([lat, lon], options);
        if (popupHtml) marker.bindPopup(popupHtml, ANALYSIS_POPUP_OPTS);
        marker.addTo(analysisLayer);
        return marker;
      }

      function formatCoordPair(lat, lon, digits = 5) {
        const la = Number(lat);
        const lo = Number(lon);
        if (!Number.isFinite(la) || !Number.isFinite(lo)) return '';
        return `${la.toFixed(digits)}, ${lo.toFixed(digits)}`;
      }

      function popupRow(label, value) {
        if (value == null || value === '') return '';
        return `<p class="popup-row"><strong>${escapeHtml(label)}:</strong> ${escapeHtml(String(value))}</p>`;
      }

      function popupIdList(label, ids) {
        if (!Array.isArray(ids)) {
          return popupRow(label, 'unavailable');
        }
        if (!ids.length) {
          return popupRow(label, 'none');
        }
        return popupRow(label, ids.join(', '));
      }

      function copyLine(label, value) {
        if (value == null || value === '') return '';
        return `${label}: ${value}`;
      }

      function localizationStatusExplanation(status) {
        if (status === 'useful') {
          return 'Meets current quality rules — not a calibrated accuracy claim.';
        }
        if (status === 'weak') {
          return 'Position available, but evidence has limitations — not a calibrated accuracy claim.';
        }
        if (status === 'unavailable') {
          return 'No publishable estimated position.';
        }
        return 'Published estimate — not ground truth.';
      }

      function formatExclusionRows(rows) {
        if (!Array.isArray(rows)) return 'unavailable';
        if (!rows.length) return 'none';
        return rows.map((row) => {
          if (!row || typeof row !== 'object') return '';
          const ear = row.ear_id || '?';
          const reason = row.reason ? ` (${row.reason})` : '';
          return `${ear}${reason}`;
        }).filter(Boolean).join('; ');
      }

      function wrapAnalysisPopup(title, coordsText, bodyHtml, copyLines) {
        const copyText = [title, coordsText, '', ...copyLines]
          .filter((line) => line != null && line !== '')
          .join('\n');
        return [
          '<div class="analysis-popup">',
          '<div class="popup-head">',
          `<p class="popup-title">${escapeHtml(title)}</p>`,
          `<button type="button" class="popup-copy" data-copy="${encodeURIComponent(copyText)}">Copy</button>`,
          '</div>',
          coordsText ? `<p class="popup-meta">${escapeHtml(coordsText)}</p>` : '',
          bodyHtml,
          '</div>',
        ].join('');
      }

      function wireAnalysisPopupCopy(mapInstance) {
        mapInstance.on('popupopen', (event) => {
          const root = event.popup && event.popup.getElement
            ? event.popup.getElement()
            : null;
          if (!root) return;
          const button = root.querySelector('.popup-copy');
          if (!button || button.dataset.wired === '1') return;
          button.dataset.wired = '1';
          button.addEventListener('click', async (clickEvent) => {
            clickEvent.preventDefault();
            clickEvent.stopPropagation();
            const text = decodeURIComponent(button.getAttribute('data-copy') || '');
            if (!text) return;
            let ok = false;
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(text);
                ok = true;
              }
            } catch (_) { /* fall through */ }
            if (!ok) {
              const area = document.createElement('textarea');
              area.value = text;
              area.setAttribute('readonly', '');
              area.style.position = 'fixed';
              area.style.left = '-9999px';
              document.body.appendChild(area);
              area.select();
              try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
              area.remove();
            }
            const previous = button.textContent;
            button.textContent = ok ? 'Copied' : 'Copy failed';
            button.classList.toggle('is-copied', ok);
            window.setTimeout(() => {
              button.textContent = previous || 'Copy';
              button.classList.remove('is-copied');
            }, 1200);
          });
        });
      }

      function observationAnalysisPopup(obs) {
        const coords = formatCoordPair(obs.lat, obs.lon);
        const interval = formatTimeSpan(obs.interval_start_utc, obs.interval_end_utc)

        const signal = obs.signal_level_dbfs != null
          && Number.isFinite(Number(obs.signal_level_dbfs))
          ? Number(obs.signal_level_dbfs).toFixed(1)
          : null;
        const membership = obs.event_id || 'none';
        const body = [
          '<p class="popup-note">EAR install coordinates — not a source estimate.</p>',
          popupRow('EAR', obs.node_id),
          popupRow('Observation', obs.id),
          popupRow('Interval', interval),
          popupRow('Reports', obs.report_count),
          popupRow('Signal (dBFS)', signal),
          popupRow('Event', membership),
        ].join('');
        return wrapAnalysisPopup(
          obs.label || 'Observation',
          coords,
          body,
          [
            copyLine('EAR', obs.node_id),
            copyLine('Observation', obs.id),
            copyLine('Interval', interval),
            copyLine('Reports', obs.report_count),
            copyLine('Signal (dBFS)', signal),
            copyLine('Event', membership),
            copyLine('Install coordinates', coords),

      function eventAnalysisPopup(event) {

        const memberObs = event.membership_observation_count != null

            : null);

          ? event.membership_ear_count

          ? event.localization_contributing_ear_count
          : (Array.isArray(event.localization_contributing_ears)

            : null);
        const memberIds = Array.isArray(event.membership_ear_ids)

          ? event.localization_contributing_ears.join(', ')
          : null;

          popupRow('EARs', memberEars),
          popupIdList('EAR IDs', event.membership_ear_ids),

          popupRow('Status', status),
          popupRow('Contributors', contribCount),
          popupIdList('Contributor IDs', event.localization_contributing_ears),
          '</div>',
          popupRow('Promoted', promoted),

        return wrapAnalysisPopup(
          event.label || event.id || 'Event',
          coords,
          body,
          [
            copyLine('Coordinates', coords),
            copyLine('Member observations', memberObs),
            copyLine('Member EARs', memberEars),
            copyLine('Member EAR IDs', memberIds),
            copyLine('Localization status', status),
            copyLine('Contributing EARs', contribCount),

          ? loc.membership_ear_count

      function drawHelicopterLayers(routeContent, analysisContent) {
        clearAnalysisOverlays();
        const bounds = [];

        if (routeContent && Array.isArray(routeContent.points)) {
          const latLngs = [];
          for (const point of routeContent.points) {
            const lat = Number(point.lat);
            const lon = Number(point.lon);
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
            latLngs.push([lat, lon]);
            bounds.push([lat, lon]);
          }
          if (latLngs.length >= 2) {
            L.polyline(latLngs, {
              color: '#15803d',
              weight: 3,
              opacity: 0.9,
              dashArray: '8 6',
            }).bindPopup(
              `<strong>${escapeHtml(routeContent.title || 'Ground-truth route')}</strong>`
              + `<p class="popup-meta">${escapeHtml(routeContent.description || 'Simulated ground truth')}</p>`,
            ).addTo(analysisLayer);
          }
        }

        if (analysisContent) {
          for (const obs of analysisContent.observations || []) {
            const lat = Number(obs.lat);
            const lon = Number(obs.lon);
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
            bounds.push([lat, lon]);
            circleMarker(lat, lon, {
              radius: 7,
              color: '#1d4ed8',
              fillColor: '#3b82f6',
              fillOpacity: 0.9,
              weight: 2,
            }, observationAnalysisPopup(obs));
          }
          for (const event of analysisContent.events || []) {
            const lat = Number(event.lat);
            const lon = Number(event.lon);
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
            bounds.push([lat, lon]);
            circleMarker(lat, lon, {
              radius: 9,
              color: '#7c2d12',
              fillColor: '#ea580c',
              fillOpacity: 0.95,
              weight: 2,
            }, eventAnalysisPopup(event));
          }
          for (const loc of analysisContent.localizations || []) {
            const lat = Number(loc.lat);
            const lon = Number(loc.lon);
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
            bounds.push([lat, lon]);
            const icon = L.divIcon({
              className: '',
              iconSize: [16, 16],
              iconAnchor: [8, 8],
              html: '<div style="width:14px;height:14px;background:#7c3aed;border:2px solid #fff;transform:rotate(45deg);box-shadow:0 1px 2px rgb(15 23 42 / 35%)" title="Estimated localization"></div>',
            });
            L.marker([lat, lon], { icon }).bindPopup(
              localizationAnalysisPopup(loc),
              ANALYSIS_POPUP_OPTS,
            ).addTo(analysisLayer);
          }
        }

        if (bounds.length) {
          map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
        }
      }

      function provenanceRunTimestamp(meta) {
        const provenance = meta && typeof meta.provenance === 'object' ? meta.provenance : null;
        const stamp = provenance && provenance.run_timestamp_utc;
        return typeof stamp === 'string' && stamp ? stamp : '';
      }

      function datasetsFromScratchList(objects) {
        const byDataset = new Map();
        for (const item of objects) {
          if (!item || typeof item !== 'object') continue;
          const meta = item.metadata && typeof item.metadata === 'object' ? item.metadata : {};
          if (meta.kind !== 'map-layer' || !meta.dataset) continue;
          const datasetId = String(meta.dataset);
          let entry = byDataset.get(datasetId);
          if (!entry) {
            entry = {
              id: datasetId,
              title: meta.dataset_title || datasetId,
              runTimestampUtc: '',
              timeStartUtc: '',
              timeEndUtc: '',
              layers: [],
            };
            byDataset.set(datasetId, entry);
          }
          entry.layers.push({
            objectId: item.id,
            layer: meta.layer || '',
            title: meta.title || meta.layer || item.id,
            role: meta.role || '',
          });
          if (meta.dataset_title) entry.title = meta.dataset_title;
          const runAt = provenanceRunTimestamp(meta)
            || (typeof item.created_at === 'string' ? item.created_at : '');
          if (runAt && (!entry.runTimestampUtc || runAt > entry.runTimestampUtc)) {
            entry.runTimestampUtc = runAt;
          }
        }
        return [...byDataset.values()].sort((a, b) => a.title.localeCompare(b.title));
      }

      function liveViewOptionHtml() {
        return '<option value="">Live</option>';
      }

      function syncViewSelector(datasets, { notice = '' } = {}) {
        availableDatasets = datasets;
        const previous = selectedDatasetId;
        const options = [liveViewOptionHtml()];
        for (const dataset of datasets) {
          options.push(
            `<option value="${escapeHtml(dataset.id)}">${escapeHtml(dataset.title)}</option>`,
          );
        }
        viewSelect.innerHTML = options.join('');
        const stillThere = datasets.some((dataset) => dataset.id === previous);
        selectedDatasetId = stillThere ? previous : '';
        viewSelect.value = selectedDatasetId;
        if (!stillThere) clearAnalysisOverlays();
        viewMetaNotice = notice;
        syncViewMetaFromSelection();
      }

      async function discoverDatasets() {
        try {
          const body = await fetchJson(
            `/api/v1/analysis/scratch?namespace=${encodeURIComponent(MAP_DEMO_NAMESPACE)}&include_content=false`,
          );
          if (!body || typeof body !== 'object' || !Array.isArray(body.objects)) {
            throw new Error('invalid scratch list');
          }
          const datasets = datasetsFromScratchList(body.objects);
          syncViewSelector(datasets, {
            notice: datasets.length ? '' : 'No layers found',
          });
        } catch (_error) {
          availableDatasets = [];
          selectedDatasetId = '';
          viewSelect.innerHTML = liveViewOptionHtml();
          clearAnalysisOverlays();
          // Keep the selector visible with Live only.
          viewMetaNotice = 'Analysis unavailable';
          syncViewMetaFromSelection();
        }
      }

      async function loadSelectedDataset() {
        if (!selectedDatasetId) {
          clearAnalysisOverlays();
          viewMetaNotice = '';
          syncViewMetaFromSelection();
          return;
        }
        const dataset = availableDatasets.find((item) => item.id === selectedDatasetId);
        if (!dataset || !dataset.layers.length) {
          clearAnalysisOverlays();
          selectedDatasetId = '';
          viewSelect.value = '';
          viewMetaNotice = '';
          syncViewMetaFromSelection();
          return;
        }
        try {
          const payloads = await Promise.all(
            dataset.layers.map(async (layer) => {
              const body = await fetchJson(
                `/api/v1/analysis/scratch/${encodeURIComponent(layer.objectId)}`,
              );
              return { layer: layer.layer, content: body && body.content };
            }),
          );
          const route = payloads.find((item) => item.layer === 'route')?.content || null;
          const analysis = payloads.find((item) => item.layer === 'analysis')?.content || null;
          if (!route && !analysis) {
            clearAnalysisOverlays();
            viewMetaNotice = 'Selected view has no drawable layers';
            syncViewMetaFromSelection();
            return;
          }
          const runAt = provenanceRunTimestamp(analysis)
            || provenanceRunTimestamp(route)
            || dataset.runTimestampUtc;
          if (runAt) dataset.runTimestampUtc = runAt;
          const span = layerTimeSpan(collectLayerTimeIsos(route, analysis));
          dataset.timeStartUtc = span.startUtc || runAt || '';
          dataset.timeEndUtc = span.endUtc || span.startUtc || runAt || '';
          drawHelicopterLayers(route, analysis);
          viewMetaNotice = '';
          syncViewMetaFromSelection();
        } catch (error) {
          clearAnalysisOverlays();
          selectedDatasetId = '';
          viewSelect.value = '';
          viewMetaNotice = 'Selected view expired or unavailable';
          syncViewMetaFromSelection();
          await discoverDatasets();
        }
      }

      function recentObservationStats(observations, nowMs = Date.now()) {
        const cutoff = nowMs - OBSERVATION_WINDOW_MS;
        const byNode = new Map();
        let total = 0;
        for (const item of observations) {
          if (!item || typeof item !== 'object') continue;
          const identity = item.identity && typeof item.identity === 'object' ? item.identity : null;
          const context = item.context && typeof item.context === 'object' ? item.context : null;
          const acoustic = item.acoustic && typeof item.acoustic === 'object' ? item.acoustic : null;
          const stamp = Date.parse(
            item.received_time_utc || context?.event_time_utc || ''
          );
          if (!Number.isFinite(stamp) || stamp < cutoff) continue;
          const nodeId = identity?.node_id;
          if (typeof nodeId !== 'string' || !nodeId) continue;
          total += 1;
          const entry = byNode.get(nodeId) || { count: 0, latest_dbfs: null, latest_at: null };
          entry.count += 1;
          if (entry.latest_at === null || stamp > entry.latest_at) {
            entry.latest_at = stamp;
            entry.latest_dbfs = typeof acoustic?.signal_level_dbfs === 'number'
              ? acoustic.signal_level_dbfs
              : null;
          }
          byNode.set(nodeId, entry);
        }
        return { total, byNode };
      }

      function popupHtml(group, obsByNode) {
        const { lat, lon, devices } = group;
        const coords = `<p class="popup-meta">${lat.toFixed(5)}, ${lon.toFixed(5)}</p>`;
        const items = devices.map((device) => {
          const status = device.status === 'online' ? 'online' : 'offline';
          const entry = obsByNode.get(device.node_id);
          let obsText = '<br>Obs (15 min): none';
          if (entry && entry.count) {
            const level = entry.latest_dbfs === null || entry.latest_dbfs === undefined
              ? ''
              : ` · latest ${entry.latest_dbfs.toFixed(1)} dBFS`;
            obsText = `<br>Obs (15 min): ${entry.count}${level}`;
          }
          return (
            `<li><strong>${escapeHtml(device.node_id)}</strong>`
            + ` · <span class="status-${status}">${status}</span>`
            + `<br>Last seen: ${escapeHtml(formatSeen(device.last_seen_at))}`
            + `${obsText}</li>`
          );
        }).join('');
        return coords + `<ul class="popup-list">${items}</ul>`;
      }

      function fitDevices(bounds) {
        if (!bounds.length) return;
        if (bounds.length === 1) {
          map.setView(bounds[0], 14);
        } else {
          map.fitBounds(bounds, { padding: [36, 36], maxZoom: 15 });
        }
        hasFittedView = true;
      }

      function renderMarkers(devices, observations) {
        const points = mappableDevices(devices);
        const groups = groupDevicesByCoordinate(points);
        const { total: recentObsTotal, byNode: obsByNode } = recentObservationStats(observations);
        markerLayer.clearLayers();
        const bounds = [];
        for (const group of groups) {
          const kind = groupKind(group.devices);
          const online = groupOnline(group.devices);
          const recentAtSite = group.devices.reduce(
            (sum, device) => sum + (obsByNode.get(device.node_id)?.count || 0),
            0,
          );
          const marker = L.marker([group.lat, group.lon], {
            icon: needleIcon(kind, online, {
              deviceCount: group.devices.length,
              obsCount: recentAtSite,
            }),
          });
          marker.bindPopup(popupHtml(group, obsByNode));
          marker.addTo(markerLayer);
          bounds.push([group.lat, group.lon]);
        }
        lastBounds = bounds;
        // Preserve pan/zoom across auto-refresh; fit only on the first successful layout.
        if (!hasFittedView && bounds.length) {
          fitDevices(bounds);
        }
        const siteLabel = groups.length === 1 ? 'site' : 'sites';
        const obsLabel = `${recentObsTotal} obs (15m)`;
        liveUpdatedAtMs = Date.now();
        if (!selectedDatasetId && !viewMetaNotice) {
          syncViewMetaFromSelection();
        }
        setStatus(
          points.length
            ? `${points.length} device${points.length === 1 ? '' : 's'} · ${groups.length} ${siteLabel} · ${obsLabel}`
            : `No mapped devices · ${obsLabel}`,
        );
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;');
      }

      async function fetchJson(path) {
        if (!ensureSession()) {
          throw new Error('Hub session unavailable. Keep the Hub window open and use its Map button.');
        }
        const base = String(session.basePath || '').replace(/\/$/, '');
        const response = await fetch(`${base}${path}`, {
          headers: { Authorization: `Bearer ${session.token}` },
          cache: 'no-store',
        });
        const body = await response.json().catch(() => (null));
        if (!response.ok) {
          const detail = body && typeof body === 'object' ? body.detail : '';
          throw new Error(typeof detail === 'string' && detail ? detail : `Request failed (${response.status}).`);
        }
        return body;
      }

      async function fetchDevices() {
        const body = await fetchJson('/api/v1/devices');
        if (!Array.isArray(body)) throw new Error('Hub returned an invalid device list.');
        return body;
      }

      async function fetchObservations() {
        const body = await fetchJson('/api/v1/observations?page=1&page_size=500&order=newest');
        if (!body || typeof body !== 'object' || !Array.isArray(body.reports)) {
          throw new Error('Hub returned an invalid observation list envelope.');
        }
        return body.reports;
      }

      async function refresh() {
        let devices = [];
        let observations = [];
        let hubOk = false;
        try {
          if (!map) initMap();
          [devices, observations] = await Promise.all([
            fetchDevices(),
            fetchObservations(),
          ]);
          hubOk = true;
          renderMarkers(devices, observations);
        } catch (error) {
          setStatus(error.message || String(error));
          if (!map) {
            const message = document.getElementById('bootstrap-message');
            if (message) {
              message.className = 'notice error';
              message.textContent = error.message || String(error);
            }
          }
        }

        // Analysis discovery/overlays must not block or undo a successful Hub render.
        await discoverDatasets();
        if (selectedDatasetId) {
          await loadSelectedDataset();
        } else {
          clearAnalysisOverlays();
        }
        if (hubOk) renderMarkers(devices, observations);
      }

      function startAutoRefresh() {
        clearInterval(refreshTimer);
        refreshTimer = setInterval(() => {
          refresh();
        }, REFRESH_MS);
      }

      refreshBtn.addEventListener('click', () => {
        refresh();
      });

      fitViewBtn.addEventListener('click', () => {
        if (map && lastBounds.length) fitDevices(lastBounds);
      });

      viewSelect.addEventListener('change', async () => {
        selectedDatasetId = viewSelect.value || '';
        viewMetaNotice = '';
        if (!selectedDatasetId) {
          clearAnalysisOverlays();
          if (!availableDatasets.length) viewMetaNotice = 'No layers found';
          syncViewMetaFromSelection();
          await refresh();
          return;
        }
        syncViewMetaFromSelection();
        await loadSelectedDataset();
        // Refresh Hub counts without re-fitting devices.
        try {
          const [devices, observations] = await Promise.all([
            fetchDevices(),
            fetchObservations(),
          ]);
          renderMarkers(devices, observations);
        } catch (_) {
          /* Hub failure handled on next full refresh */
        }
      });

      refresh().then(startAutoRefresh);
    </script>
  </body>
</html>
