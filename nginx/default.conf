server {
    listen 443 ssl;
    server_name _;

    # Container IPs may change on recreation; query Docker DNS at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hub_bootstrap_upstream hub-bootstrap:8443;
    set $dbmap_web_upstream dbmap-web:443;

    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        proxy_pass https://$hub_bootstrap_upstream/health;
        proxy_ssl_server_name on;
        proxy_ssl_name hub.local;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /api/ {
        proxy_pass https://$hub_bootstrap_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name hub.local;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location / {
        proxy_pass https://$dbmap_web_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name dbmap-web;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
