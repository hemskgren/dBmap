# Fail2ban filter for dBmap Hub HTTPS API authentication failures.
# Matches Nginx combined access_log lines where /api/ returned HTTP 401.
#
# Example:
#   203.0.113.10 - - [01/Nov/2026:09:00:00 +0000] "GET /api/v1/hub/status HTTP/1.1" 401 52 "-" "..."

[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "[A-Z]+ [^"]*/api/[^"]*" 401\b
ignoreregex =
