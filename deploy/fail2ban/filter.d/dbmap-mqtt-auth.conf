# Fail2ban filter for dBmap Mosquitto MQTT authentication failures.
# Matches host-mounted mosquitto.log lines (log_timestamp_format %d/%b/%Y %H:%M:%S).
#
# Examples:
#   01/Nov/2026 08:30:13: Client f2b-test [203.0.113.10:41528] disconnected: not authorised.
#   01/Nov/2026 08:30:13: Client connection from 203.0.113.10:41528 failed: bad username or password.

[Definition]
failregex = ^\S+ \S+: Client \S+ \[<HOST>:\d+\] disconnected: not authorised\.?\s*$
            ^\S+ \S+: Client connection from <HOST>:\d+ failed: (?:bad username or password|not authorised)\.?\s*$
ignoreregex =
